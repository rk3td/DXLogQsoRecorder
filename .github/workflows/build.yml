name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: DXLogQsoRecorder/DXLogQsoRecorder.csproj

      - name: Restore
        run: dotnet restore .\DXLogQsoRecorder\DXLogQsoRecorder.csproj

      - name: Build
        run: dotnet build .\DXLogQsoRecorder\DXLogQsoRecorder.csproj -c Release --no-restore

      - name: Publish portable Windows x64 build
        run: >-
          dotnet publish .\DXLogQsoRecorder\DXLogQsoRecorder.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\artifacts\win-x64

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: DXLogQsoRecorder-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
